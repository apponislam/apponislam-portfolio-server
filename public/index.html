<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Appon Islam | Portfolio Backend API</title>

        <link rel="icon" type="image/png" href="https://i.ibb.co.com/g3gCBzP/apclassroom.jpg" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Norican&display=swap" rel="stylesheet" />

        <style>
            :root {
                --primary: #10b981;
                --primary-glow: rgba(16, 185, 129, 0.35);
                --bg: #090d16;
                --surface: #111827;
                --border: rgba(255, 255, 255, 0.1);
                --text-main: #f9fafb;
                --text-dim: #9ca3af;
                --accent-blue: #3b82f6;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Outfit", sans-serif;
                background-color: var(--bg);
                color: var(--text-main);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                overflow-x: hidden;
                padding: 2rem 1rem;
            }

            /* Dark Emerald Moving Mesh Background */
            .mesh-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
                overflow: hidden;
            }

            .mesh-blob {
                position: absolute;
                width: 600px;
                height: 600px;
                border-radius: 50%;
                filter: blur(140px);
                opacity: 0.18;
                animation: float 22s infinite alternate ease-in-out;
            }

            .blob-1 {
                background: #059669;
                top: -15%;
                left: -10%;
            }
            .blob-2 {
                background: #3b82f6;
                bottom: -15%;
                right: -10%;
                animation-delay: -6s;
            }
            .blob-3 {
                background: #10b981;
                top: 45%;
                left: 35%;
                width: 350px;
                height: 350px;
                animation-delay: -12s;
            }

            @keyframes float {
                from {
                    transform: translate(0, 0) scale(1);
                }
                to {
                    transform: translate(12%, 12%) scale(1.12);
                }
            }

            .content-wrapper {
                width: 100%;
                max-width: 820px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3.5rem;
                z-index: 1;
            }

            /* Brand Section */
            .brand {
                display: flex;
                align-items: center;
                gap: 0.85rem;
                opacity: 0.95;
            }

            .brand-avatar {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                border: 2px solid var(--primary);
                object-fit: cover;
                box-shadow: 0 0 20px var(--primary-glow);
            }

            .brand-name {
                font-family: "Norican", cursive;
                font-size: 2rem;
                color: #ffffff;
                letter-spacing: 0.02em;
            }

            /* Hero Status Section */
            .hero {
                text-align: center;
            }

            .status-badge {
                display: inline-flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.65rem 1.4rem;
                background: rgba(17, 24, 39, 0.8);
                backdrop-filter: blur(12px);
                border: 1px solid var(--border);
                border-radius: 100px;
                margin-bottom: 2rem;
                font-weight: 600;
                font-size: 0.85rem;
                letter-spacing: 0.06em;
                color: var(--primary);
            }

            .pulse {
                width: 10px;
                height: 10px;
                background: var(--primary);
                border-radius: 50%;
                box-shadow: 0 0 15px var(--primary-glow);
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0% {
                    transform: scale(1);
                    opacity: 1;
                }
                50% {
                    transform: scale(1.35);
                    opacity: 0.45;
                }
                100% {
                    transform: scale(1);
                    opacity: 1;
                }
            }

            h1 {
                font-size: clamp(3.2rem, 10vw, 6rem);
                font-weight: 800;
                line-height: 0.95;
                letter-spacing: -0.03em;
                margin-bottom: 1.25rem;
                background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
                background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .hero p {
                color: var(--text-dim);
                font-size: 1.1rem;
                max-width: 540px;
                margin: 0 auto;
                line-height: 1.6;
            }

            /* Info Glass Bar */
            .info-bar {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 1.5rem;
                padding: 2rem;
                background: rgba(17, 24, 39, 0.65);
                backdrop-filter: blur(24px);
                border: 1px solid var(--border);
                border-radius: 24px;
            }

            .info-item {
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
            }

            .info-item label {
                font-size: 0.7rem;
                text-transform: uppercase;
                color: var(--primary);
                font-weight: 700;
                letter-spacing: 0.1em;
            }

            .info-item span {
                font-size: 1.05rem;
                font-weight: 600;
            }

            #running-time {
                font-family: monospace;
                color: var(--primary);
            }

            /* Links Bar (Icon Only) */
            .links-bar {
                display: flex;
                gap: 1rem;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
            }

            .icon-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 48px;
                height: 48px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.04);
                color: var(--text-main);
                border: 1px solid var(--border);
                text-decoration: none;
                transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                cursor: pointer;
                position: relative;
            }

            .icon-btn:hover {
                background: var(--primary);
                color: #090d16;
                border-color: var(--primary);
                transform: translateY(-4px) scale(1.08);
                box-shadow: 0 8px 25px var(--primary-glow);
            }

            .icon-btn svg {
                width: 22px;
                height: 22px;
                transition: transform 0.25s ease;
            }

            .icon-btn:hover svg {
                transform: scale(1.1);
            }

            /* Mobile Adjustments */
            @media (max-width: 768px) {
                body {
                    padding: 2.5rem 1rem;
                    justify-content: flex-start;
                }
                .content-wrapper {
                    gap: 2rem;
                }
                .info-bar {
                    grid-template-columns: 1fr;
                    gap: 1.25rem;
                    padding: 1.5rem;
                    text-align: center;
                }
                .info-item {
                    align-items: center;
                }
                h1 {
                    font-size: 3rem;
                }
                .icon-btn {
                    width: 44px;
                    height: 44px;
                }
                .icon-btn svg {
                    width: 20px;
                    height: 20px;
                }
            }

            footer {
                margin-top: 2rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.4rem;
                color: var(--text-dim);
                font-size: 0.8rem;
                font-weight: 500;
            }
        </style>
    </head>
    <body>

            <footer>
                <p>&copy; <span id="year"></span> APPON ISLAM PORTFOLIO ENGINE</p>
                <p style="opacity: 0.5; font-size: 0.7rem">VERSION 1.0.0</p>
            </footer>
        </div>

        <script>
            document.getElementById("year").textContent = new Date().getFullYear();

            function updateClock() {
                const now = new Date();
                const h = now.getHours().toString().padStart(2, "0");
                const m = now.getMinutes().toString().padStart(2, "0");
                const s = now.getSeconds().toString().padStart(2, "0");
                document.getElementById("running-time").textContent = `${h}:${m}:${s}`;
            }

            updateClock();
            setInterval(updateClock, 1000);
        </script>
    </body>
</html>
